app = "prahari-ews"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8001"
  DATA_SOURCE = "synthetic"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
